<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200"><rect width="1800" height="1200" fill="#fff"/><text x="80" y="100" font-family="Arial" font-size="28" font-weight="700" fill="#1f8a5b">WHY IT IS DIFFERENT</text><text x="80" y="180" font-family="Arial" font-size="62" font-weight="800" fill="#0d2438">A cash forecast needs control structure</text><g font-family="Arial"><g><rect x="80" y="300" rx="28" width="790" height="300" fill="#f6f8fa" stroke="#d9e1e7"/><text x="130" y="365" font-size="32" font-weight="700" fill="#0d2438">01 — SOURCE INTEGRITY</text><text x="130" y="430" font-size="24" fill="#1d2733">Evidence, ownership and freshness stay visible.</text><text x="130" y="520" font-size="22" font-weight="700" fill="#1f8a5b">Source type • evidence • owner • freshness</text></g><g><rect x="930" y="300" rx="28" width="790" height="300" fill="#f6f8fa" stroke="#d9e1e7"/><text x="980" y="365" font-size="32" font-weight="700" fill="#0d2438">02 — TIMING CONFIDENCE</text><text x="980" y="430" font-size="24" fill="#1d2733">Contractual and expected dates stay separate.</text><text x="980" y="520" font-size="22" font-weight="700" fill="#1f8a5b">Scheduled • window • uncertain</text></g><g><rect x="80" y="660" rx="28" width="790" height="300" fill="#f6f8fa" stroke="#d9e1e7"/><text x="130" y="725" font-size="32" font-weight="700" fill="#0d2438">03 — SCENARIO CONTROL</text><text x="130" y="790" font-size="24" fill="#1d2733">Scenarios inherit a frozen Base.</text><text x="130" y="880" font-size="22" font-weight="700" fill="#1f8a5b">No typing over Base</text></g><g><rect x="930" y="660" rx="28" width="790" height="300" fill="#f6f8fa" stroke="#d9e1e7"/><text x="980" y="725" font-size="32" font-weight="700" fill="#0d2438">04 — VARIANCE LEARNING</text><text x="980" y="790" font-size="24" fill="#1d2733">Actuals are matched back to forecast by cause.</text><text x="980" y="880" font-size="22" font-weight="700" fill="#1f8a5b">Amount • timing • omission • classification</text></g></g><text x="80" y="1080" font-family="Arial" font-size="34" font-weight="700" fill="#0d2438">Can we trust the next 13 weeks enough to act before a shortfall occurs?</text></svg>